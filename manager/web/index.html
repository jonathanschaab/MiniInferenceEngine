<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Inference Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body class="chat-layout">
    <header>
        <h1>Mini Inference Engine <span id="engine-status-indicator" class="status"></span></h1>
    </header>
    
    <!-- Session Control Bar -->
    <div class="control-bar">
        <div class="control-group">
            <select id="chat-model-select" class="control-select"></select>
            <select id="compressor-model-select" class="control-select"></select>
            <select id="backend-select" class="control-select"></select>
        </div>
        <div class="control-group">
            <button id="export-chat-btn" class="btn-nav bg-mauve">💾 Export</button>
            <button id="toggle-parameters-btn" class="btn-nav bg-sky">🎛️ Parameters</button>
            <button id="clear-chat-btn" class="btn-nav bg-red">🗑️ Clear Chat</button>
        </div>
    </div>

    <div id="parameters-panel" class="parameters-panel">
        <div class="param-group">
            <label for="param-temp">Temperature: <span id="val-temp">0.7</span></label>
            <input type="range" id="param-temp" min="0" max="2" step="0.1" value="0.7">
        </div>
        <div class="param-group">
            <label for="param-top-p">Top-P: <span id="val-top-p">0.95</span></label>
            <input type="range" id="param-top-p" min="0" max="1" step="0.05" value="0.95">
        </div>
        <div class="param-group">
            <label for="param-top-k">Top-K:</label>
            <input type="number" id="param-top-k" min="1" max="100" value="40" class="input-number-sm">
        </div>
        <div class="param-group">
            <label for="param-max-tokens">Max Tokens:</label>
            <input type="number" id="param-max-tokens" min="1" max="8192" value="500" class="input-number-md">
        </div>
        <div class="param-group">
            <label for="param-seed">Seed (Optional):</label>
            <input type="number" id="param-seed" placeholder="Random" class="input-number-lg">
        </div>
        <div class="param-group">
            <label for="param-context-buffer">Ctx Buffer:</label>
            <input type="number" id="param-context-buffer" min="0" max="128000" value="1024" class="input-number-md">
        </div>
        <div class="param-group">
            <label for="param-memory-strategy">Llama.cpp Strategy:</label>
            <select id="param-memory-strategy" class="control-select-bordered">
                <option value="offload">CPU Offload (Max Context)</option>
                <option value="compress">Compression (Max Speed)</option>
            </select>
        </div>
        <div class="param-group">
            <label for="param-yarn-enabled">YaRN Extension:</label>
            <input type="checkbox" id="param-yarn-enabled" checked class="checkbox-lg">
        </div>
    </div>

    <div id="main-wrapper">
        <div id="sidebar">
            <button id="new-chat-btn">+ New Chat</button>
            <div id="session-list"></div>
        </div>
        
        <div id="chat-area">
            <div id="chat-container">
                <div class="message ai-message">System: Engine ready. How can I help you?</div>
            </div>
            <div id="typing-indicator" class="typing px-20">Thinking...</div>
            
            <div id="input-container">
                <textarea id="prompt-input" placeholder="Message the AI... (Shift + Enter for new line)" rows="1"></textarea>
                <button id="send-btn">Send</button>
                <button id="stop-btn">Stop</button>
                <button id="regen-btn" title="Regenerate last response">🔄</button>
            </div>
        </div>
    </div>

    <!-- Custom Modals -->
    <div id="rename-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Rename Chat</h2>
            <input type="text" id="rename-input" class="modal-input" autocomplete="off">
            <div class="modal-actions">
                <button class="btn-cancel" id="rename-cancel-btn">Cancel</button>
                <button class="btn-run" id="rename-confirm-btn">Rename</button>
            </div>
        </div>
    </div>

    <div id="delete-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Delete Chat</h2>
            <p class="mb-20">Are you sure you want to delete this chat session?</p>
            <div class="modal-actions">
                <button class="btn-cancel" id="delete-cancel-btn">Cancel</button>
                <button class="btn-run bg-red text-base" id="delete-confirm-btn">Delete</button>
            </div>
        </div>
    </div>

    <div id="export-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Export Chat</h2>
            <p class="mb-20">Choose the format to export the current conversation branch:</p>
            <div class="modal-actions">
                <button class="btn-cancel" id="export-cancel-btn">Cancel</button>
                <div>
                    <button class="btn-run bg-blue mr-5" id="export-md-btn">Markdown</button>
                    <button class="btn-run bg-yellow" id="export-json-btn">JSON</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/chat.js"></script>
</body>
</html>
