bind_address = "127.0.0.1:3000"
oauth_redirect_uri = "http://localhost:3000/auth/google/callback"
oauth_client_secret_path = "client_secret.apps.googleusercontent.com.json"
oauth_auth_url = "https://accounts.google.com/o/oauth2/v2/auth"
oauth_token_url = "https://oauth2.googleapis.com/token"
oauth_userinfo_url = "https://www.googleapis.com/oauth2/v2/userinfo"
admin_emails = ["jschaab@gmail.com"]
user_emails = []
secure_cookies = false
gpu_device_index = 0
max_concurrent_downloads = 2
max_concurrent_chunk_downloads = 8
telemetry_retention_days = 30
log_level_console = "warn"
log_level_file = "info"
log_level_memory = "debug"
log_file_name = "server.log"

